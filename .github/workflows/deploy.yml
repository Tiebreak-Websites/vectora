name: Deploy to Cloudflare Pages

# Deploys to Cloudflare Pages (project `vectora`), gated behind HTTP Basic Auth
# (see functions/_middleware.js).
#
# Currently MANUAL only (run from the Actions tab → "Run workflow").
# To re-enable auto-deploy on push to `live`, uncomment the `push` trigger below
# AND set the CLOUDFLARE_API_TOKEN secret to a token WITHOUT IP-address filtering
# — the current token is IP-restricted and is rejected from GitHub runners (error 9109).
on:
  workflow_dispatch:
  # push:
  #   branches: [live]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=vectora --branch=live --commit-dirty=true
